apiVersion: apps/v1
kind: Deployment
metadata:
  name: finazapp-front-deployment
spec:
  selector: 
    matchLabels:
      app: finazapp-front
  replicas: 2
  template:
    metadata: 
      labels:
        app: finazapp-front
    spec:
      containers:
        - name: finazapp-front
          image: finazapp-front
          ports:
            - containerPort: 80
              name: http
